name: Publikace denní marže

# Ranní agent nahraje šifrovaný dashboard na Google Drive; tady si ho GitHub stáhne a zveřejní.
on:
  schedule:
    - cron: "*/15 4-11 * * *"   # každých 15 min 6:00–13:45 (letní čas), 5:00–12:45 (zimní)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout nejnovější šifrovaný dashboard z Drive
        run: python3 tools/fetch_from_drive.py docs/dashboard.enc.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
